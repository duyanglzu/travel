<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="旅行攻略合集 - 川西、新疆、西藏等自驾路线规划">
    <title>旅行攻略合集 | Kevin's Travel</title>
    <link rel="icon" href="assets/icon-compass.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link id="themeCSS" rel="stylesheet" href="themes/journal.css">
    <style>
        /* ===== Reset & Base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "HarmonyOS Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            background: var(--bg-body);
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Top Bar ===== */
        .top-bar {
            position: relative;
            z-index: 10;
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (min-width: 769px) {
            .top-bar { padding: 20px 32px 0; }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand::before {
            content: '';
            width: 20px;
            height: 20px;
            background: var(--gradient-sky);
            border-radius: 50%;
            opacity: 0.8;
            flex-shrink: 0;
        }

        .theme-bar {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .theme-btn {
            background: transparent;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .theme-btn:hover { border-color: var(--primary); color: var(--primary); }
        .theme-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .dark-toggle-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid var(--glass-border);
            border-radius: 20px;
            color: var(--text-secondary);
            padding: 5px 12px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .dark .dark-toggle-btn {
            background: var(--dark-glass-bg);
            border-color: var(--dark-glass-border);
            color: var(--dark-text-secondary);
        }

        .dark-toggle-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg);
        }

        /* ===== Hero ===== */
        .hero {
            position: relative;
            overflow: hidden;
            color: white;
            padding: 40px 24px 60px;
            margin: -52px 0 0 0;
            text-align: center;
            min-height: 340px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        @media (min-width: 769px) {
            .hero { padding: 72px 48px 96px; min-height: 420px; margin-top: -60px; }
        }

        /* Hero background image */
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('assets/hero-sichuan.jpg');
            background-size: cover;
            background-position: center 25%;
            z-index: 0;
            filter: saturate(1.05) contrast(1.1);
        }

        /* Hero gradient overlay */
        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--hero-overlay);
            z-index: 1;
        }

        .dark .hero::after {
            background: var(--dark-hero-overlay);
        }

        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 700px;
            width: 100%;
            animation: heroFadeIn 0.8s ease-out;
        }

        @keyframes heroFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hero-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            margin-bottom: 20px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .hero-icon:hover { transform: scale(1.05); }

        .hero-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (min-width: 769px) {
            .hero-icon { width: 60px; height: 60px; margin-bottom: 24px; }
        }

        .hero h1 {
            font-family: "Noto Serif SC", serif;
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-shadow: 0 2px 24px rgba(0,0,0,0.35);
            line-height: 1.25;
        }

        @media (min-width: 769px) {
            .hero h1 { font-size: 44px; margin-bottom: 14px; letter-spacing: 4px; }
        }

        .hero-subtitle {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 400;
            letter-spacing: 2px;
            line-height: 1.6;
            text-shadow: 0 1px 12px rgba(0,0,0,0.25);
        }

        @media (min-width: 769px) {
            .hero-subtitle { font-size: 16px; letter-spacing: 3px; }
        }

        .hero-subtitle span {
            display: inline-block;
            padding: 0 12px;
            position: relative;
        }

        .hero-subtitle span + span::before {
            content: '·';
            position: absolute;
            left: -2px;
            opacity: 0.5;
        }

        /* Hero scroll indicator */
        .hero-scroll {
            position: relative;
            z-index: 3;
            margin-top: 28px;
            animation: bounceDown 2s ease-in-out infinite;
        }

        .hero-scroll svg {
            width: 20px;
            height: 20px;
            stroke: rgba(255,255,255,0.6);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        @keyframes bounceDown {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(6px); opacity: 1; }
        }

        @media (min-width: 769px) {
            .hero-scroll { margin-top: 32px; }
        }

        /* ===== Content Area ===== */
        .content-area {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 24px 40px;
            position: relative;
        }

        @media (min-width: 769px) {
            .content-area { padding: 28px 32px 56px; }
        }

        /* ===== Section Label ===== */
        .section-label {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            position: relative;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
            margin-left: 4px;
        }

        .section-label-dot {
            width: 4px;
            height: 20px;
            border-radius: 2px;
            background: var(--primary);
            flex-shrink: 0;
        }

        .section-label-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* ===== Destination Card ===== */
        .dest-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: visible;
        }

        @media (min-width: 769px) {
            .dest-card { padding: 32px; border-radius: 28px; }
        }

        .dest-card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-border);
        }

        /* Subtle decorative gradient bar on the left */
        .dest-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--gradient-sky);
            border-radius: 0 3px 3px 0;
            opacity: 0.6;
        }

        .dark .dest-card::before {
            opacity: 0.4;
        }

        .dest-card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 6px;
        }

        .dest-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        @media (min-width: 769px) {
            .dest-card-icon { width: 44px; height: 44px; }
        }

        .dest-card-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dest-card-icon.sichuan {
            background: linear-gradient(135deg, #DBEAFE, #E0F2FE);
        }

        .dark .dest-card-icon.sichuan {
            background: linear-gradient(135deg, #1E3A5F, #0C4A6E);
        }

        .dest-card-icon.xinjiang {
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
        }

        .dark .dest-card-icon.xinjiang {
            background: linear-gradient(135deg, #78350F, #92400E);
        }

        .dest-card-icon.xizang {
            background: linear-gradient(135deg, #F3E8FF, #EDE9FE);
        }

        .dark .dest-card-icon.xizang {
            background: linear-gradient(135deg, #3B0764, #581C87);
        }

        .dest-card h2 {
            font-size: 18px;
            color: var(--text);
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: 0.3px;
        }

        @media (min-width: 769px) {
            .dest-card h2 { font-size: 20px; }
        }

        .dest-card-desc {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 18px;
            padding-left: 54px;
            line-height: 1.5;
        }

        @media (min-width: 769px) {
            .dest-card-desc { padding-left: 58px; }
        }

        /* ===== Route Grid / Carousel ===== */
        .dest-grid {
            display: block;
            padding: 0;
            margin: 0;
        }

        .dest-grid::-webkit-scrollbar { display: none; }

        .dest-grid > .route-card {
            position: sticky;
            top: 88px;
            margin-bottom: 0;
            width: 100%;
            transform-origin: center top;
        }

        /* 层叠滚动：后一张略下移，露出上一张顶边形成堆叠层次 */
        .dest-grid > .route-card + .route-card {
            top: 102px;
        }

        @media (min-width: 769px) {
            .dest-grid {
                overflow: visible;
                margin: 0;
                padding: 0;
            }

            .dest-grid > .route-card {
                width: 100%;
                scroll-snap-align: none;
            }
        }

        /* ===== Swipe Dots ===== */
        .swipe-dots {
            display: none;
            justify-content: center;
            gap: 6px;
            margin-top: 14px;
        }

        .swipe-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .swipe-dot.active {
            background: var(--primary);
            width: 20px;
            border-radius: 3px;
        }

        @media (min-width: 769px) {
            .swipe-dots { display: none; }
        }

        /* ===== Route Card ===== */
        .route-card {
            background: var(--bg-highlight);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        @media (min-width: 769px) {
            .route-card { border-radius: 18px; }
        }

        .route-card:hover {
            border-color: var(--primary-border);
            box-shadow: var(--shadow-primary);
            transform: translateY(-3px);
        }

        .route-card a {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: var(--text);
            padding: 16px 18px;
        }

        @media (min-width: 769px) {
            .route-card a { padding: 18px 20px; gap: 20px; }
        }

        /* Thumbnail */
        .route-thumb {
            width: 88px;
            height: 88px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        @media (min-width: 769px) {
            .route-thumb { width: 110px; height: 110px; border-radius: 14px; }
        }

        .route-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .route-card:hover .route-thumb img {
            transform: scale(1.08);
        }

        /* Thumbnail overlay gradient */
        .route-thumb::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.10) 100%);
            pointer-events: none;
        }

        .route-info {
            flex: 1;
            min-width: 0;
        }

        .route-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .route-name {
            font-weight: 700;
            font-size: 16px;
            line-height: 1.35;
            color: var(--text);
            letter-spacing: 0.2px;
        }

        @media (min-width: 769px) {
            .route-name { font-size: 17px; }
        }

        .route-arrow {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--primary-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .route-arrow svg {
            width: 14px;
            height: 14px;
            stroke: var(--primary);
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.3s ease;
        }

        .route-card:hover .route-arrow {
            background: var(--gradient-sky);
        }

        .route-card:hover .route-arrow svg {
            stroke: white;
            transform: translateX(2px);
        }

        .route-meta {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 5px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .route-meta::before {
            content: '📍';
            font-size: 11px;
            opacity: 0.7;
        }

        .route-tags {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .route-tag {
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .route-tag.main {
            background: linear-gradient(135deg, #FEE2E2, #FECACA);
            color: #DC2626;
        }

        .dark .route-tag.main {
            background: linear-gradient(135deg, #7F1D1D, #991B1B);
            color: #FCA5A5;
        }

        .route-tag.parallel {
            background: linear-gradient(135deg, #DBEAFE, #BFDBFE);
            color: #0369A1;
        }

        .dark .route-tag.parallel {
            background: linear-gradient(135deg, #1E3A5F, #1E40AF);
            color: #93C5FD;
        }

        .route-tag.info {
            background: var(--bg-body);
            color: var(--text-light);
        }

        .dark .route-tag.info {
            background: var(--dark-bg-secondary);
            color: var(--dark-text-light);
        }

        /* ===== Future Destinations ===== */
        .future-section {
            padding: 8px 0 0;
        }

        .future-text {
            font-size: 13px;
            color: var(--text-light);
            line-height: 1.7;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .future-text::before {
            content: '🗺️';
            font-size: 14px;
        }

        .future-chips {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 4px;
        }

        .future-chips::-webkit-scrollbar { display: none; }

        .future-chip {
            flex-shrink: 0;
            font-size: 12px;
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 100px;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            white-space: nowrap;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            cursor: default;
        }

        .future-chip:hover {
            border-color: var(--primary-border);
            color: var(--primary);
            background: var(--primary-bg);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(2,132,199,0.08);
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 24px 24px 0;
            font-size: 11px;
            color: var(--text-light);
            max-width: 1100px;
            margin: 0 auto;
            letter-spacing: 0.5px;
        }

        .footer-divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), transparent);
            border-radius: 1px;
            margin: 0 auto 14px;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== Responsive fine-tuning ===== */
        @media (max-width: 480px) {
            .dest-card { padding: 18px; border-radius: 20px; }
            .dest-grid { margin: 0; padding: 0; }
            .dest-grid > .route-card { min-width: 0; width: 100%; }
            .route-card a { padding: 12px 14px; gap: 12px; }
            .route-thumb { width: 72px; height: 72px; }
            .route-name { font-size: 14px; }
        }

        /* ===== Page transition ===== */
        .content-area > * {
            animation: sectionFadeIn 0.6s ease-out both;
        }

        .content-area > *:nth-child(2) { animation-delay: 0.1s; }
        .content-area > *:nth-child(3) { animation-delay: 0.2s; }

        @keyframes sectionFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Top bar -->
    <div class="top-bar">
        <div class="brand">Kevin's Travel</div>
        <div class="theme-bar" id="themeBar">
            <button class="dark-toggle-btn" id="darkToggle">深色</button>
        </div>
    </div>

    <!-- Hero -->
    <div class="hero">
        <div class="hero-content">
            <div class="hero-icon"><img src="assets/icon-compass.jpg" alt=""></div>
            <h1>旅行攻略合集</h1>
            <p class="hero-subtitle">
                <span>自驾路线规划</span>
                <span>实用攻略</span>
                <span>持续更新</span>
            </p>
        </div>
        <div class="hero-scroll">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </div>
    </div>

    <!-- Content area -->
    <div class="content-area">
        <!-- Section: Active Routes -->
        <div class="section-label">
            <div class="section-label-dot"></div>
            <div class="section-label-text">在途计划</div>
        </div>

        <!-- Sichuan Section -->
        <div class="dest-card">
            <div class="dest-card-header">
                <div class="dest-card-icon sichuan"><img src="assets/icon-sichuan.jpg" alt=""></div>
                <h2>四川 · 川西高原</h2>
            </div>
            <p class="dest-card-desc">甘孜州东线深度游，适合家庭亲子出行</p>

            <div class="dest-grid">
                <div class="route-card">
                    <a href="west-sichuan.html">
                        <div class="route-thumb">
                            <img src="assets/hero-sichuan.jpg" alt="川西环线">
                        </div>
                        <div class="route-info">
                            <div class="route-card-top">
                                <span class="route-name">完整环线</span>
                                <div class="route-arrow">
                                    <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                                </div>
                            </div>
                            <div class="route-meta">17天 · 成都-康定-甲根坝-道孚-金川-四姑娘山-重庆</div>
                            <div class="route-tags">
                                <span class="route-tag main">主力方案</span>
                                <span class="route-tag info">两车两家</span>
                                <span class="route-tag info">V8.0</span>
                            </div>
                        </div>
                    </a>
                </div>

                <div class="route-card">
                    <a href="paired-trip.html">
                        <div class="route-thumb">
                            <img src="assets/hero-sichuan.jpg" alt="并行方案">
                        </div>
                        <div class="route-info">
                            <div class="route-card-top">
                                <span class="route-name">双方并行</span>
                                <div class="route-arrow">

    <script>
        function setupThemeSystem() {
            const themeLink = document.getElementById('themeCSS');
            const darkBtn = document.getElementById('darkToggle');
            const html = document.documentElement;

            const savedTheme = localStorage.getItem('colorTheme') || 'default';
            const savedDark = localStorage.getItem('theme');

            function applyTheme(name) {
                themeLink.href = 'themes/' + name + '.css';
                localStorage.setItem('colorTheme', name);
            }

            function applyDark(isDark) {
                html.classList.toggle('dark', isDark);
                darkBtn.textContent = isDark ? '浅色' : '深色';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            applyTheme(savedTheme);
            if (savedDark === 'dark' || (!savedDark && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                applyDark(true);
            }

            darkBtn.addEventListener('click', function() {
                applyDark(!html.classList.contains('dark'));
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            setupThemeSystem();
            setupSwipeDots();
            setupStackScroll();
        });

        function setupSwipeDots() {
            var grid = document.querySelector('.dest-grid');
            var dots = document.querySelectorAll('#swipeDots .swipe-dot');
            if (!grid || dots.length === 0) return;

            grid.addEventListener('scroll', function() {
                var cardWidth = grid.scrollWidth / grid.children.length;
                var idx = Math.round(grid.scrollLeft / cardWidth);
                dots.forEach(function(d, i) {
                    d.classList.toggle('active', i === idx);
                });
            });
        }

        // 层叠滚动：后一张卡片叠上来时，被压住的卡片轻微缩小淡出，强化堆叠层次。
        // 纯 CSS sticky 已保证堆叠位置，此段为视觉增强，失效也不影响堆叠。
        function setupStackScroll() {
            var grid = document.querySelector('.dest-grid');
            if (!grid) return;
            var cards = Array.prototype.slice.call(grid.querySelectorAll(':scope > .route-card'));
            if (cards.length < 2) return;
            var stickyTop = 88;
            var offset = 14;

            function update() {
                for (var i = 0; i < cards.length; i++) {
                    var card = cards[i];
                    var rect = card.getBoundingClientRect();
                    var progress = 0;
                    if (cards[i + 1]) {
                        var nextTop = cards[i + 1].getBoundingClientRect().top;
                        progress = Math.min(1, Math.max(0, (stickyTop + offset - nextTop) / offset));
                    } else {
                        progress = Math.min(1, Math.max(0, (stickyTop - rect.top) / 80));
                    }
                    var scale = (1 - progress * 0.05).toFixed(3);
                    var opacity = (1 - progress * 0.4).toFixed(3);
                    card.style.transform = 'scale(' + scale + ')';
                    card.style.opacity = opacity;
                    card.style.zIndex = String(i + 1);
                }
            }

            window.addEventListener('scroll', update, { passive: true });
            window.addEventListener('resize', update);
            update();
        }
    </script>
